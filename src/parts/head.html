<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LB Precifica — Preço certo e anúncio pronto para marketplaces</title>
<meta name="description" content="Calcule o preço de venda na Shopee, Mercado Livre, TikTok Shop e Shein com as taxas oficiais de 2026 e crie título, descrição e fotos do anúncio com IA.">
<meta name="theme-color" content="#0a0908">
<link rel="icon" href="data:image/jpeg;base64,{{LOGO}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0908;--surface:#13110f;--surface2:#1a1815;--ink:#f6f2e9;--ink2:#d8d2c4;--muted:#958e80;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --gold:#d9ae52;--gold2:#f0cf7a;--gold3:#b8892b;--goldbg:rgba(217,174,82,.12);--goldln:rgba(217,174,82,.35);--dark:#0a0908;
  --ok:#5fd394;--okbg:rgba(47,158,99,.14);--bad:#ff8a75;--badbg:rgba(255,107,91,.12);
  --shopee:#ee4d2d;--mly:#ffe600;
  --disp:"Plus Jakarta Sans",Inter,system-ui,sans-serif;--serif:"Instrument Serif",Georgia,serif;
  --r:20px;--r2:14px;--sh:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px rgba(0,0,0,.35);--sh2:0 24px 70px rgba(0,0,0,.6)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{margin:0;line-height:1.1;letter-spacing:-.025em;font-family:var(--disp);font-weight:800}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
::selection{background:var(--gold);color:#1d1606}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em;background:linear-gradient(100deg,#f7dc93 10%,#d9ae52 55%,#b8892b);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em}
/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 18px;font-weight:600;font-size:14.5px;cursor:pointer;border:1px solid var(--line2);background:var(--surface2);color:var(--ink);transition:.18s;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--goldln);background:#211e1a}
.btn.prim{background:var(--ink);color:#141210;border-color:var(--ink)}
.btn.prim:hover{background:#fff}
.btn.gold{background:linear-gradient(180deg,#f0cf7a,#d9ae52 60%,#c79a3c);color:#1d1606;border:0;box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 10px 30px rgba(217,174,82,.28)}
.btn.gold:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 14px 40px rgba(217,174,82,.4)}
.btn.lg{padding:15px 26px;font-size:16px;border-radius:14px}
.btn.pill{border-radius:99px}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.ghost{background:transparent;border-color:transparent}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.g-btn{display:flex;width:100%;align-items:center;justify-content:center;gap:12px;background:#fff;color:#1f1f1f;border:0;border-radius:14px;padding:14px 18px;font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:.18s}
.g-btn:hover{transform:translateY(-1px)}
/* Marca */
.marca{display:flex;align-items:center;gap:10px;text-decoration:none}
.marca img{width:34px;height:34px;border-radius:10px;display:block;box-shadow:0 0 0 1px var(--goldln)}
.marca b{font-family:var(--disp);font-weight:800;font-size:18px;letter-spacing:-.02em}
.marca b span{color:var(--gold)}
/* Logos de marketplace */
.mp-logo{display:inline-grid;place-items:center;flex:none;border-radius:10px;overflow:hidden}
.mp-logo svg{display:block}
.mp-logo.shopee{background:var(--shopee)}
.mp-logo.tiktok{background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.16) inset}
.mp-logo.ml{background:var(--mly)}
.mp-logo.shein{background:#000;color:#fff;font:800 9px/1 Inter,sans-serif;letter-spacing:.02em;box-shadow:0 0 0 1px rgba(255,255,255,.16) inset}
